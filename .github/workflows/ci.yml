name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test, licence
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Mypy strict
        run: uv run mypy src/

      - name: Import linter
        run: uv run lint-imports

      - name: Unit and contract tests
        run: uv run pytest tests/ -m "unit or contract" --tb=short -q || test $? -eq 5

      - name: Licence check (no AGPL/GPL/SSPL)
        run: ./scripts/check_licences.sh

  lockfile:
    name: Verify lockfile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Check uv.lock is up to date
        run: uv lock --check

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run pip-audit
        run: uv run pip-audit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openspec:
    name: Spec validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Validate specs
        run: |
          if [ -d "openspec" ]; then
            uv run openspec validate --all --strict --json --no-interactive
          else
            echo "OpenSpec not initialized yet. Skipping."
          fi
