[project]
name = "eu-tariff-engine"
version = "0.1.0"
description = "EU Tariff Compliance and Validation Engine"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = []

[project.scripts]
eu-tariff-engine = "tariff_engine:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tariff_engine"

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = ["tariff_engine"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.importlinter]
root_packages = ["tariff_engine"]

[[tool.importlinter.contracts]]
name = "Layer architecture"
type = "layers"
layers = [
    "tariff_engine.interfaces",
    "tariff_engine.adapters",
    "tariff_engine.application",
    "tariff_engine.domain",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (offline, deterministic)",
    "contract: Contract tests against frozen payloads",
    "integration: Integration tests requiring services",
    "eval: Evaluation tests against golden set",
    "live: Live tests hitting real APIs (scheduled only)",
]
addopts = "-m 'unit or contract' --strict-markers"
